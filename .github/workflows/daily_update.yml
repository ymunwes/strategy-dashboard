name: Nightly Benchmark Update

on:
  schedule:
    - cron: '30 21 * * 1-5' # Runs at 9:30 PM UTC (roughly 5:30 PM ET, after market close)
    - cron: '0 0 * * *'     # Still runs at midnight UTC for final settlement
  workflow_dispatch:

jobs:
  update-benchmarks:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run update script
        run: python scripts/update_benchmarks.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/benchmarks/*.csv
          git commit -m "chore: automated benchmark update" || echo "No changes to commit"
          git push
