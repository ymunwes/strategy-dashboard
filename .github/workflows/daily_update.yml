name: Nightly Benchmark Update

on:
  schedule:
    - cron: '30 21 * * 1-5' # Runs at 9:30 PM UTC (roughly 5:30 PM ET, after market close)
    - cron: '0 0 * * *'     # Still runs at midnight UTC for final settlement
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-benchmarks:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run update script
        run: python scripts/update_benchmarks.py

      - name: Commit and push changes
        id: push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/benchmarks/*.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: automated benchmark update"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy workflow
        if: steps.push.outputs.pushed == 'true'
        run: |
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
